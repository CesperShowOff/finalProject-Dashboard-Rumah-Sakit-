<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task List</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind custom config: extend with brand colours -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                blue:      '#1E40AF', /* primary blue  */
                blueLight: '#3B82F6', /* lighter blue  */
                orange:    '#F97316', /* accent orange */
              },
            },
            boxShadow: {
              card: '0 4px 24px rgba(30,64,175,0.08)',
            },
          },
        },
      };
    </script>

    <!-- Custom styles (animations, scrollbar, etc.) -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="min-h-screen bg-gradient-to-br from-blue-50 to-white flex items-start justify-center px-4 py-10">

    <!-- ═══════════════════════════════════════════
         Main application container
    ════════════════════════════════════════════ -->
    <main class="w-full max-w-lg" aria-label="Task List Application">

      <!-- App header -->
      <header class="mb-8 text-center">
        <div class="inline-flex items-center gap-2 mb-1">
          <!-- Clipboard icon (inline SVG) -->
          <svg class="w-8 h-8 text-brand-orange" fill="none" stroke="currentColor" stroke-width="2"
               viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2
                 M9 5a2 2 0 002 2h2a2 2 0 002-2
                 M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          <h1 class="text-3xl font-extrabold text-brand-blue tracking-tight">Task List</h1>
        </div>
        <p class="text-sm text-slate-500">Organise your day, one task at a time.</p>
      </header>

      <!-- ─── Card container ──────────────────────── -->
      <section class="bg-white rounded-2xl shadow-card p-6 space-y-6">

        <!-- Add-task form -->
        <form id="task-form" novalidate aria-label="Add new task">
          <div class="flex gap-2">
            <input
              id="task-input"
              type="text"
              placeholder="Add a new task…"
              maxlength="120"
              autocomplete="off"
              class="flex-1 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5
                     text-sm text-slate-800 placeholder-slate-400
                     focus:outline-none focus:ring-2 focus:ring-brand-blueLight focus:border-transparent
                     transition duration-200"
            />
            <button
              type="submit"
              class="add-btn rounded-xl bg-brand-blue px-5 py-2.5 text-sm font-semibold text-white
                     hover:bg-brand-blueLight active:scale-95
                     transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-brand-blueLight"
              aria-label="Add task"
            >
              + Add
            </button>
          </div>
          <!-- Inline validation message -->
          <p id="form-error" class="mt-1 hidden text-xs text-red-500" role="alert">
            Task cannot be empty.
          </p>
        </form>

        <!-- Filter tabs -->
        <nav class="flex gap-1 rounded-xl bg-slate-100 p-1" aria-label="Task filters">
          <button data-filter="all"       class="filter-btn active-filter flex-1 rounded-lg py-1.5 text-xs font-semibold transition-all duration-200">All</button>
          <button data-filter="active"    class="filter-btn flex-1 rounded-lg py-1.5 text-xs font-semibold transition-all duration-200">Active</button>
          <button data-filter="completed" class="filter-btn flex-1 rounded-lg py-1.5 text-xs font-semibold transition-all duration-200">Completed</button>
        </nav>

        <!-- Task list -->
        <ul id="task-list" class="space-y-2 min-h-[60px]" aria-live="polite" aria-label="Tasks">
          <!-- Tasks are injected here by JavaScript -->
        </ul>

        <!-- Empty-state message (shown when list is empty) -->
        <p id="empty-state" class="hidden text-center text-sm text-slate-400 py-4">
          No tasks here. 🎉
        </p>

        <!-- Footer: task counter + bulk action -->
        <footer class="flex items-center justify-between text-xs text-slate-400 pt-2 border-t border-slate-100">
          <span id="task-counter">0 task(s) left</span>
          <button
            id="clear-completed"
            class="hover:text-brand-orange transition-colors duration-200 focus:outline-none"
            aria-label="Clear all completed tasks"
          >
            Clear Completed
          </button>
        </footer>

      </section><!-- /card -->
    </main><!-- /main -->

    <!-- Edit modal (hidden by default) -->
    <div id="edit-modal" role="dialog" aria-modal="true" aria-label="Edit task"
         class="fixed inset-0 z-50 hidden items-center justify-center bg-black/30 backdrop-blur-sm px-4">
      <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-6 space-y-4">
        <h2 class="text-base font-bold text-brand-blue">Edit Task</h2>
        <input
          id="edit-input"
          type="text"
          maxlength="120"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5
                 text-sm text-slate-800
                 focus:outline-none focus:ring-2 focus:ring-brand-blueLight focus:border-transparent
                 transition duration-200"
        />
        <p id="edit-error" class="hidden text-xs text-red-500" role="alert">Task cannot be empty.</p>
        <div class="flex gap-2 justify-end">
          <button id="edit-cancel"
            class="rounded-xl px-4 py-2 text-sm text-slate-500 hover:bg-slate-100 transition duration-200 focus:outline-none">
            Cancel
          </button>
          <button id="edit-save"
            class="rounded-xl bg-brand-blue px-5 py-2 text-sm font-semibold text-white
                   hover:bg-brand-blueLight active:scale-95
                   transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-brand-blueLight">
            Save
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
